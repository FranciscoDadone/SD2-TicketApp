name: PR Label Check

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, reopened]

jobs:
  check-labels:
    name: Verify required label
    runs-on: ubuntu-latest
    steps:
      - name: Check for patch / minor / major label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const required = ['patch', 'minor', 'major'];
            const found = required.filter(l => labels.includes(l));

            if (found.length === 0) {
              core.setFailed(
                `❌ This PR must have exactly one of these labels: ${required.join(', ')}.\n` +
                `  patch  → Bug fix or chore (bump patch version)\n` +
                `  minor  → New feature (bump minor version)\n` +
                `  major  → Breaking change (bump major version)`
              );
            } else if (found.length > 1) {
              core.setFailed(
                `❌ This PR has more than one version label: ${found.join(', ')}. Pick only one.`
              );
            } else {
              console.log(`✅ PR has label: ${found[0]}`);
            }

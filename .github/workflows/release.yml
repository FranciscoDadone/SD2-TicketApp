name: Release

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: sebamediza/ticket-app-sd2
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Version, build, push and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 1. Read the merged PR label to determine bump type ────────────────────
      - name: Get version bump type from merged PR label
        id: pr-labels
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            const merged = prs.find(pr => pr.merged_at !== null);
            if (!merged) {
              core.setFailed('No merged PR found for this commit. Push directly to main is not allowed for releases.');
              return;
            }

            const labels = merged.labels.map(l => l.name);
            console.log(`PR #${merged.number} labels: ${labels.join(', ')}`);

            const bump = ['major', 'minor', 'patch'].find(l => labels.includes(l));
            if (!bump) {
              core.setFailed(
                `PR #${merged.number} has no version label. ` +
                `Add one of: patch, minor, major.`
              );
              return;
            }

            core.setOutput('bump', bump);
            core.setOutput('pr_number', merged.number);
            console.log(`Bump type: ${bump}`);

      # ── 2. Calculate the next semantic version from the latest git tag ────────
      - name: Calculate new version
        id: version
        run: |
          git fetch --tags

          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "Current version: $LATEST"

          MAJOR=$(echo $LATEST | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo $LATEST | cut -d. -f2)
          PATCH=$(echo $LATEST | cut -d. -f3)

          case "${{ steps.pr-labels.outputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"

          echo "version=${NEW_VERSION}"           >> $GITHUB_OUTPUT
          echo "version_plain=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      # ── 3. Create and push the git tag ────────────────────────────────────────
      - name: Tag release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      # ── 4. Build and push Docker image to DockerHub ───────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./TicketApp
          file: ./TicketApp/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version_plain }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print release
        run: |
          echo "✅ Released ${{ steps.version.outputs.version }} (PR #${{ steps.pr-labels.outputs.pr_number }}, bump: ${{ steps.pr-labels.outputs.bump }})"

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.TicketApp.gateway'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	// Versión exacta de Spring Cloud compatible con Spring Boot 4.0.x
	set('springCloudVersion', "2025.1.1")
}

dependencies {

	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

	// Stack Reactivo
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Seguridad y validación de JWT (Keycloak)
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Generación de tokens de Google Cloud
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.24.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'

	implementation 'io.grpc:grpc-netty:1.62.2'
	implementation 'io.grpc:grpc-protobuf:1.62.2'
	implementation 'io.grpc:grpc-stub:1.62.2'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}